name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native codec tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned libjxl
        # app/build.gradle.kts clones libjxl (pinned commit) into .deps/ during configuration.
        run: ./gradlew --no-daemon -q help

      - name: Build codec tests
        run: |
          cmake -S native-tests -B build-host -DCMAKE_BUILD_TYPE=Release \
                -DGXL_LIBJXL_DIR="$PWD/.deps/libjxl-v0.12.0"
          cmake --build build-host --parallel 4

      - name: Generate JPEG samples
        run: |
          python3 -m pip install --quiet pillow
          python3 native-tests/make_test_jpegs.py build-host

      - name: Run codec tests
        run: build-host/codec_test build-host/*.jpg

  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gxl-cam-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
